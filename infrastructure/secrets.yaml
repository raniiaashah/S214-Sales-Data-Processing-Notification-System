AWSTemplateFormatVersion: '2010-09-09'
Description: 'S214 Sales Platform - Secrets Manager and SSM Parameter Store
  This template creates:
  - Secrets Manager secret for database credentials
  - SSM Parameters for non-sensitive configuration

  Security Notes:
  - Database password is auto-generated by Secrets Manager
  - No hardcoded secrets in templates
  - SSM Parameters store non-sensitive configuration only'

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Default: dev
    Description: Environment name (dev, staging, prod)

  SNSTopicArn:
    Type: String
    Description: SNS topic ARN

  MasterUsername:
    Type: String
    Default: admin
    NoEcho: true
    Description: Master username for RDS (will be stored in Secrets Manager)

Resources:
  # ============================================
  # Secrets Manager - Database Credentials
  # ============================================
  # Stores database credentials securely
  # Password is auto-generated and never exposed
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 's214-${Environment}/database/credentials'
      Description: !Sub 'Database credentials for S214 ${Environment} environment'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${MasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true
      Tags:
        - Key: Name
          Value: !Sub 's214-${Environment}-database-secret'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: s214-sales-platform
        - Key: ResourceType
          Value: Secret

  # ============================================
  # SSM Parameter Store - Non-sensitive Configuration
  # ============================================
  # Stores non-sensitive configuration values
  # These are NOT secrets - they are resource identifiers

  SNSTopicArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/s214/${Environment}/sns-topic-arn'
      Type: String
      Value: !Ref SNSTopicArn
      Description: !Sub 'SNS topic ARN for ${Environment} environment'
      Tags:
        Environment: !Ref Environment
        Project: s214-sales-platform

  SecretArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/s214/${Environment}/secret-arn'
      Type: String
      Value: !Ref DatabaseSecret
      Description: !Sub 'Secrets Manager ARN for ${Environment} environment'
      Tags:
        Environment: !Ref Environment
        Project: s214-sales-platform

  EnvironmentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/s214/${Environment}/environment'
      Type: String
      Value: !Ref Environment
      Description: 'Environment name'
      Tags:
        Environment: !Ref Environment
        Project: s214-sales-platform

Outputs:
  DatabaseSecretArn:
    Description: Database Secret ARN
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub 's214-${Environment}-database-secret-arn'

  DatabaseSecretName:
    Description: Database Secret Name
    Value: !Sub 's214-${Environment}/database/credentials'
    Export:
      Name: !Sub 's214-${Environment}-database-secret-name'

  RDSEndpointParameterName:
    Description: RDS Endpoint Parameter Name
    Value: !Sub '/s214/${Environment}/rds-endpoint'
    Export:
      Name: !Sub 's214-${Environment}-rds-endpoint-param'

  SNSTopicArnParameterName:
    Description: SNS Topic ARN Parameter Name
    Value: !Sub '/s214/${Environment}/sns-topic-arn'
    Export:
      Name: !Sub 's214-${Environment}-sns-topic-arn-param'

  SecretArnParameterName:
    Description: Secret ARN Parameter Name
    Value: !Sub '/s214/${Environment}/secret-arn'
    Export:
      Name: !Sub 's214-${Environment}-secret-arn-param'
