# Staging Environment Configuration
# This file contains environment-specific settings for the staging environment

environment: staging
region: us-east-1

# VPC Configuration
vpc:
  cidr: 10.1.0.0/16
  enableDnsHostnames: true
  enableDnsSupport: true

# Subnet Configuration
subnets:
  public:
    - cidr: 10.1.1.0/24
      az: a
    - cidr: 10.1.2.0/24
      az: b
  private:
    - cidr: 10.1.10.0/24
      az: a
    - cidr: 10.1.11.0/24
      az: b

# RDS Configuration
rds:
  engine: mysql
  engineVersion: "8.0"
  instanceClass: db.t3.small
  allocatedStorage: 20
  maxAllocatedStorage: 100
  backupRetention: 7
  multiAz: false
  storageEncrypted: true
  deletionProtection: false
  masterUsername: admin

# Lambda Configuration
lambda:
  processor:
    memorySize: 256
    timeout: 120
    runtime: python3.11
    logRetention: 14
  customResource:
    memorySize: 256
    timeout: 180
    runtime: python3.11
    logRetention: 14

# EventBridge Configuration
eventbridge:
  schedule: "cron(0 8 * * ? *)"  # Daily at 8 AM UTC
  enabled: true

# SNS Configuration
sns:
  notificationEmail: staging@example.com

# CloudWatch Configuration
cloudwatch:
  logRetentionDays: 14
  alarmEvaluationPeriods: 2
  alarmThreshold: 1

# Tags
tags:
  Environment: staging
  Project: s214-sales-platform
  ManagedBy: cloudformation