name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read

jobs:
  # ============================================
  # Determine Environment
  # ============================================
  determine-env:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Validate Before Deploy
  # ============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: determine-env
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install cfn-lint

      - name: Validate CloudFormation templates
        run: |
          cfn-lint infrastructure/*.yaml

      - name: Run unit tests
        run: |
          pip install -r src/processor/requirements.txt
          pip install pytest
          pytest tests/unit/ -v

  # ============================================
  # Package Lambda Code
  # ============================================
  package:
    name: Package Lambda
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Package processor Lambda
        run: |
          mkdir -p packages
          cd src/processor
          pip install -r requirements.txt -t .
          zip -r ../../packages/processor.zip .
          cd ../..

      - name: Package custom resource Lambda
        run: |
          cd src/custom-resource
          pip install -r requirements.txt -t .
          zip -r ../../packages/custom-resource.zip .
          cd ../..

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: packages/

  # ============================================
  # Deploy to AWS
  # ============================================
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [determine-env, package]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check AWS Secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ AWS_ACCESS_KEY_ID is EMPTY"
            exit 1
          else
            echo "✅ AWS_ACCESS_KEY_ID is available"
          fi

          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ AWS_SECRET_ACCESS_KEY is EMPTY"
            exit 1
          else
            echo "✅ AWS_SECRET_ACCESS_KEY is available"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: packages/

      - name: Upload to S3
        run: |
          # Create bucket if it doesn't exist
          BUCKET_NAME="s214-${{ needs.determine-env.outputs.environment }}-artifacts-${{ github.run_id }}"
          
          aws s3 mb s3://$BUCKET_NAME --region ${{ secrets.AWS_REGION }} || true
          
          # Upload Lambda packages
          aws s3 cp packages/processor.zip s3://$BUCKET_NAME/lambda/processor.zip
          aws s3 cp packages/custom-resource.zip s3://$BUCKET_NAME/lambda/custom-resource.zip
          
          # Upload CloudFormation templates
          aws s3 cp infrastructure/ s3://$BUCKET_NAME/templates/ --recursive
          
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Clean up ROLLBACK_COMPLETE stacks
        run: |
          STACK_NAME="s214-${{ needs.determine-env.outputs.environment }}-sales-platform"
          
          # Wait for a previous failed deployment to finish rolling back.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NONE")
          
          if [ "$STACK_STATUS" == "ROLLBACK_IN_PROGRESS" ]; then
            echo "⚠️  Stack is still rolling back, waiting..."
            aws cloudformation wait stack-rollback-complete --stack-name $STACK_NAME
            STACK_STATUS="ROLLBACK_COMPLETE"
          elif [ "$STACK_STATUS" == "UPDATE_ROLLBACK_IN_PROGRESS" ] || \
               [ "$STACK_STATUS" == "UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS" ]; then
            echo "⚠️  Stack is still updating and rolling back, waiting..."
            aws cloudformation wait stack-update-rollback-complete --stack-name $STACK_NAME
            STACK_STATUS="UPDATE_ROLLBACK_COMPLETE"
          fi

          if [ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ] || \
             [ "$STACK_STATUS" == "UPDATE_ROLLBACK_FAILED" ] || \
             [ "$STACK_STATUS" == "CREATE_FAILED" ]; then
            echo "⚠️  Stack is in $STACK_STATUS state, deleting..."
            aws cloudformation delete-stack --stack-name $STACK_NAME
            aws cloudformation wait stack-delete-complete --stack-name $STACK_NAME
            echo "✅ Stack deleted successfully"
          else
            echo "✅ Stack status: $STACK_STATUS (no cleanup needed)"
          fi

      - name: Deploy CloudFormation stack
        run: |
          STACK_NAME="s214-${{ needs.determine-env.outputs.environment }}-sales-platform"
          
          aws cloudformation deploy \
            --template-file infrastructure/root.yaml \
            --stack-name $STACK_NAME \
            --parameter-overrides \
              Environment=${{ needs.determine-env.outputs.environment }} \
              LambdaCodeBucket=${{ env.BUCKET_NAME }} \
              NotificationEmail=${{ secrets.NOTIFICATION_EMAIL }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset || {
            echo "❌ Deployment failed. Fetching stack events..."
            aws cloudformation describe-stack-events \
              --stack-name $STACK_NAME \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`ROLLBACK_IN_PROGRESS` || ResourceStatus==`DELETE_IN_PROGRESS`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
              --output table
            echo "Failed nested stack details:"
            for nested_stack in $(aws cloudformation describe-stack-events \
              --stack-name $STACK_NAME \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].PhysicalResourceId' \
              --output text); do
              if [[ "$nested_stack" != arn:aws:cloudformation:* ]]; then
                continue
              fi
              aws cloudformation describe-stack-events \
                --stack-name "$nested_stack" \
                --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
                --output table || true
              echo "Pre-deployment validation events for $nested_stack:"
              aws cloudformation describe-events \
                --stack-name "$nested_stack" \
                --query 'OperationEvents[?EventType==`VALIDATION_ERROR`].[LogicalResourceId,ResourceType,ValidationName,ValidationStatusReason,ValidationPath]' \
                --output table || true
            done
            exit 1
          }

      - name: Wait for stack completion
        run: |
          STACK_NAME="s214-${{ needs.determine-env.outputs.environment }}-sales-platform"
          
          aws cloudformation wait stack-create-complete \
            --stack-name $STACK_NAME || \
          aws cloudformation wait stack-update-complete \
            --stack-name $STACK_NAME

      - name: Get stack outputs
        run: |
          STACK_NAME="s214-${{ needs.determine-env.outputs.environment }}-sales-platform"
          
          echo "Stack Outputs:"
          aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Cleanup S3 bucket
        if: always()
        run: |
          BUCKET_NAME="${{ env.BUCKET_NAME }}"
          
          if [ -n "$BUCKET_NAME" ]; then
            aws s3 rb s3://$BUCKET_NAME --force || true
          fi
